<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SolarGrid - Emissão de Faturas Solares</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background-color: #f0f4f8; color: #1e293b; }
        .navbar { background-color: #0f172a; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar .brand { color: #facc15; font-size: 20px; font-weight: bold; text-decoration: none; }
        .navbar .nav-links a { color: #e2e8f0; text-decoration: none; margin-left: 20px; font-weight: 500; padding: 6px 12px; border-radius: 4px; }
        .navbar .nav-links a:hover, .navbar .nav-links a.active { background-color: #1e293b; color: #facc15; }
        .container { max-width: 960px; margin: 30px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 4px; }
        button { background-color: #1976d2; color: white; border: none; padding: 10px 18px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        .alert-success { background-color: #dcfce7; color: #166534; padding: 12px; margin-bottom: 15px; border-radius: 5px; }
        .alert-error { background-color: #fee2e2; color: #991b1b; padding: 12px; margin-bottom: 15px; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #f8fafc; }
    </style>
</head>
<body>
<div class="navbar">
    <a href="/" class="brand">SolarGrid Web</a>
    <div class="nav-links">
        <a href="/">Dashboard</a>
        <a href="/usinas">Usinas</a>
        <a href="/inversores">Inversores &amp; Risco</a>
        <a href="/faturas" class="active">Faturamento</a>
    </div>
</div>

<div class="container">
    <h1>SolarGrid - Faturamento e Compensação de Energia</h1>

    <div id="msgSucesso" th:if="${mensagemSucesso}" class="alert-success" th:text="${mensagemSucesso}"></div>
    <div id="msgErro" th:if="${mensagemErro}" class="alert-error" th:text="${mensagemErro}"></div>

    <form action="/faturas/emitir" method="post" id="formFatura">
        <div class="form-group">
            <label for="nomeCliente">Nome / Razão Social:</label>
            <input type="text" id="nomeCliente" name="nomeCliente" placeholder="Ex: João da Silva">
        </div>
        <div class="form-group">
            <label for="cpfCnpj">CPF / CNPJ:</label>
            <input type="text" id="cpfCnpj" name="cpfCnpj" placeholder="Ex: 12345678901">
        </div>
        <div class="form-group">
            <label for="consumoKwh">Consumo da Rede (kWh):</label>
            <input type="number" step="0.1" id="consumoKwh" name="consumoKwh" value="0">
        </div>
        <div class="form-group">
            <label for="creditoKwh">Crédito Solar Injetado (kWh):</label>
            <input type="number" step="0.1" id="creditoKwh" name="creditoKwh" value="0">
        </div>
        <div class="form-group">
            <label for="bandeira">Bandeira Tarifária (1=Verde, 2=Amarela, 3=Vermelha P1, 4=Vermelha P2):</label>
            <input type="number" id="bandeira" name="bandeira" value="1">
        </div>
        <div class="form-group">
            <label for="diasAtraso">Dias de Atraso:</label>
            <input type="number" id="diasAtraso" name="diasAtraso" value="0">
        </div>
        <button type="submit" id="btnEmitir">Calcular e Emitir Fatura</button>
    </form>

    <h2>Faturas Emitidas</h2>
    <table id="tabelaFaturas">
        <thead>
        <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>CPF/CNPJ</th>
            <th>Bandeira</th>
            <th>Valor Final (R$)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="f : ${faturas}">
            <td th:text="${f.id}"></td>
            <td th:text="${f.cliente.nomeRazaoSocial}"></td>
            <td th:text="${f.cliente.documentoCpfCnpj}"></td>
            <td th:text="${f.bandeiraTarifaria}"></td>
            <td th:text="${f.valorTotalCalculado}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
