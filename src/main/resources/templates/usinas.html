<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SolarGrid - Gestão de Usinas</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; background-color: #f0f4f8; color: #1e293b; }
        .navbar { background-color: #0f172a; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar .brand { color: #facc15; font-size: 20px; font-weight: bold; text-decoration: none; }
        .navbar .nav-links a { color: #e2e8f0; text-decoration: none; margin-left: 20px; font-weight: 500; padding: 6px 12px; border-radius: 4px; }
        .navbar .nav-links a:hover, .navbar .nav-links a.active { background-color: #1e293b; color: #facc15; }
        .container { max-width: 960px; margin: 30px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 4px; }
        button { background-color: #16a34a; color: white; border: none; padding: 10px 18px; cursor: pointer; border-radius: 5px; margin-top: 15px; font-weight: bold; }
        .alert-success { background-color: #dcfce7; color: #166534; padding: 12px; margin-bottom: 15px; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #f8fafc; }
    </style>
</head>
<body>
<div class="navbar">
    <a href="/" class="brand">SolarGrid Web</a>
    <div class="nav-links">
        <a href="/">Dashboard</a>
        <a href="/usinas" class="active">Usinas</a>
        <a href="/inversores">Inversores &amp; Risco</a>
        <a href="/faturas">Faturamento</a>
    </div>
</div>

<div class="container">
    <h1>Gestão de Unidades Geradoras</h1>
    <div th:if="${mensagemSucesso}" class="alert-success" th:text="${mensagemSucesso}"></div>

    <form action="/usinas/cadastrar" method="post">
        <div class="form-grid">
            <div class="form-group">
                <label>Tipo de Usina:</label>
                <select name="tipo">
                    <option value="SOLAR">Solar Fotovoltaica</option>
                    <option value="FLUTUANTE">Solar Flutuante</option>
                    <option value="EOLICA">Usina Eólica</option>
                </select>
            </div>
            <div class="form-group">
                <label>Código:</label>
                <input type="text" name="codigo" placeholder="Ex: US-JF-04" required>
            </div>
            <div class="form-group">
                <label>Município:</label>
                <input type="text" name="municipio" placeholder="Ex: Juiz de Fora" required>
            </div>
            <div class="form-group">
                <label>Potência Instalada (kW):</label>
                <input type="number" step="0.1" name="potenciaKw" value="150" required>
            </div>
            <div class="form-group">
                <label>Qtd. Módulos (Solar):</label>
                <input type="number" name="modulos" value="300">
            </div>
            <div class="form-group">
                <label>Irradiação Solar (h/dia):</label>
                <input type="number" step="0.1" name="irradiacao" value="5.2">
            </div>
            <div class="form-group">
                <label>Bônus Resfriamento (Flutuante):</label>
                <input type="number" step="0.01" name="bonusResfriamento" value="0.12">
            </div>
            <div class="form-group">
                <label>Aerogeradores (Eólica):</label>
                <input type="number" name="aerogeradores" value="4">
            </div>
            <div class="form-group">
                <label>Velocidade Vento m/s (Eólica):</label>
                <input type="number" step="0.1" name="velocidadeVento" value="11.0">
            </div>
        </div>
        <button type="submit">Cadastrar Unidade Geradora</button>
    </form>

    <h2>Parque Gerador Cadastrado</h2>
    <table>
        <thead>
        <tr>
            <th>Código</th>
            <th>Classe (Polimorfismo)</th>
            <th>Município</th>
            <th>Potência (kW)</th>
            <th>Geração Estimada (kWh/mês)</th>
            <th>Taxa Manutenção (R$)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usinas}">
            <td th:text="${u.codigoIdentificacao}"></td>
            <td th:text="${u.class.simpleName}"></td>
            <td th:text="${u.municipio}"></td>
            <td th:text="${u.potenciaInstaladaKw}"></td>
            <td th:text="${#numbers.formatDecimal(u.calcularGeracaoEstimadaMensal(), 1, 1)}"></td>
            <td th:text="${#numbers.formatDecimal(u.calcularTaxaManutencaoBase(), 1, 2)}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
